<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Login | Epilepsy Care System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <header>
        <h1>Epilepsy Care System</h1>
        <p>Caregiver Portal</p>

        <nav>
            <a href="../index.html">Home</a>
            <a href="caregiver.html">Dashboard</a>
        </nav>
    </header>

    <main class="container">

        <section class="login-card">

            <h2>Caregiver Login</h2>

            <p class="description">
                Sign in to access your caregiver account and
                monitor connected patients.
            </p>

            <form id="caregiverLoginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">Login</button>

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

            </form>

            <div class="signup-link">
                <p>
                    Don't have an account?
                    <a href="#">Contact your system administrator</a>
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Epilepsy Care System. All Rights Reserved.</p>
    </footer>
<script src="../js/script.js"></script>
</body>
</html>
