<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | Epilepsy Care</title>

   <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">

    <!-- HEADER -->
    <header>
        <h1>Epilepsy Care System</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="doctor.html">Dashboard</a>
        </nav>
    </header>

    <!-- LOGIN SECTION -->
    <main class="container">

        <section class="login-card">

            <h2>Doctor Login</h2>

            <p>
                Login to access patient health summaries
                and consultation information.
            </p>

            <form id="doctorLoginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Login</button>

            </form>

            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="signup.html">Register here</a>
                </p>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Epilepsy Care System. All Rights Reserved.</p>
    </footer>
<script src="../js/script.js"></script>
</body>
</html>
